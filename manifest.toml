packaging_format = 2

id = "blossom"
name = "Blossom Server"
description.en = "Self-hosted content-addressed blob storage server implementing the Blossom protocol for Nostr"
version = "0.1.24~ynh1"
maintainers = ["imattau"]

[upstream]
license = "MIT"
code = "https://github.com/hzrd149/blossom-server"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "1G"
ram.build = "512M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Blossom clients (Nostr apps) are not YunoHost users - they authenticate uploads/deletes with their own Nostr-signed requests, not portal login. Leave this as visitors unless you specifically want to gate the whole server behind YunoHost SSO."

    [install.enable_dashboard]
    type = "boolean"
    default = 0
    ask.en = "Enable the admin dashboard?"
    help.en = "Enable the /admin dashboard. Leave its password blank to generate one at first start."

    [install.storage_backend]
    type = "select"
    choices = ["local", "s3"]
    default = "local"
    ask.en = "Storage backend"

    [install.max_upload_size]
    type = "select"
    choices = ["100 MiB", "500 MiB", "1 GiB", "2 GiB", "5 GiB"]
    default = "2 GiB"
    ask.en = "Maximum upload size"
    help.en = "Choose a preset: 100 MiB, 500 MiB, 1 GiB, 2 GiB, or 5 GiB."

    [install.s3_endpoint]
    type = "string"
    default = "https://s3.invalid"
    visible = "storage_backend == 's3'"
    ask.en = "S3 endpoint"

    [install.s3_bucket]
    type = "string"
    default = "not-configured"
    visible = "storage_backend == 's3'"
    ask.en = "S3 bucket"

    [install.s3_access_key]
    type = "string"
    default = "not-configured"
    visible = "storage_backend == 's3'"
    ask.en = "S3 access key"

    [install.s3_secret_key]
    type = "string"
    default = "not-configured-secret"
    visible = "storage_backend == 's3'"
    ask.en = "S3 secret key"

    [install.s3_region]
    type = "string"
    visible = "storage_backend == 's3'"
    default = "us-east-1"
    ask.en = "S3 region"

[resources]
    [resources.sources.main]
        url = "https://github.com/hzrd149/blossom-server/archive/refs/tags/v6.1.5.tar.gz"
        sha256 = "0a958cecf432951b6df7a25484fbd30970d748564173a7745a71483fbd6f43e5"
        format = "tar.gz"
        extract = true

    [resources.sources.deno]
        url = "https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip"
        sha256 = "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2"
        format = "zip"
        extract = true
        in_subdir = false

        [resources.sources.deno.arm64]
        url = "https://github.com/denoland/deno/releases/download/v2.9.6/deno-aarch64-unknown-linux-gnu.zip"
        sha256 = "9a46afc6c392c7cd2ff71a31558935545b46408d0e87f7a86908c712721c046e"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]
        [resources.ports.main]
        default = 3000

    [resources.apt]
        packages = "ffmpeg"

    [resources.permissions]
        [resources.permissions.main]
        url = "/"
        auth_header = false
