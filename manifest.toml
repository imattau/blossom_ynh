packaging_format = 2

id = "blossom"
name = "Blossom Server"
description.en = "Self-hosted content-addressed blob storage server implementing the Blossom protocol for Nostr"
version = "0.1~ynh1"
maintainers = ["imattau"]

[upstream]
license = "MIT"
code = "https://github.com/hzrd149/blossom-server"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "1G"
ram.build = "512M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.admin]
    type = "user"

    [install.enable_dashboard]
    type = "boolean"
    default = false
    ask.en = "Enable the admin dashboard?"
    help.en = "Enable the /admin dashboard. Leave its password blank to generate one at first start."

    [install.storage_backend]
    type = "select"
    choices = ["local", "s3"]
    default = "local"
    ask.en = "Storage backend"

    [install.max_upload_size]
    type = "select"
    choices = ["104857600", "536870912", "1073741824", "2147483648", "5368709120"]
    default = "2147483648"
    ask.en = "Maximum upload size"
    help.en = "Choose a preset: 100 MiB, 500 MiB, 1 GiB, 2 GiB, or 5 GiB."

    [install.s3_endpoint]
    type = "string"
    optional = true
    visible = "storage_backend == 's3'"
    ask.en = "S3 endpoint"

    [install.s3_bucket]
    type = "string"
    optional = true
    visible = "storage_backend == 's3'"
    ask.en = "S3 bucket"

    [install.s3_access_key]
    type = "string"
    optional = true
    visible = "storage_backend == 's3'"
    ask.en = "S3 access key"

    [install.s3_secret_key]
    type = "password"
    optional = true
    visible = "storage_backend == 's3'"
    ask.en = "S3 secret key"

    [install.s3_region]
    type = "string"
    optional = true
    visible = "storage_backend == 's3'"
    default = "us-east-1"
    ask.en = "S3 region"

[resources]
    [resources.sources.main]
        url = "https://github.com/hzrd149/blossom-server/archive/refs/tags/v6.1.5.tar.gz"
        sha256 = "0a958cecf432951b6df7a25484fbd30970d748564173a7745a71483fbd6f43e5"
        format = "tar.gz"
        extract = true

    [resources.sources.deno]
        url = "https://github.com/denoland/deno/releases/download/v2.1.4/deno-x86_64-unknown-linux-gnu.zip"
        sha256 = "54a81939cccb2af114c4d0a68a554cf4a04b1f08728e70f663f83781de19d785"
        format = "zip"
        extract = true

        [resources.sources.deno.arm64]
        url = "https://github.com/denoland/deno/releases/download/v2.1.4/deno-aarch64-unknown-linux-gnu.zip"
        sha256 = "93ad8efe6f60da8566652dfd39cf2a23cb0e35d8c6d6faac7392a917d2b50039"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]
        [resources.ports.main]
        default = 3000

    [resources.apt]
        packages = "ffmpeg"
