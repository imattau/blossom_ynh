version = "1.0"

[main]
    [main.server]
        [main.server.public_domain]
        ask.en = "Public hostname"
        type = "string"
        bind = "publicDomain:__INSTALL_DIR__/config.yml"

        [main.server.storage_backend]
        ask.en = "Storage backend"
        type = "select"
        choices = ["local", "s3"]
        bind = "storage>backend:__INSTALL_DIR__/config.yml"

        [main.server.max_upload_size]
        ask.en = "Maximum upload size"
        type = "select"
        choices = ["100 MiB", "500 MiB", "1 GiB", "2 GiB", "5 GiB"]
        bind = "upload>maxSize:__INSTALL_DIR__/config.yml"

    [main.s3]
        visible = "storage_backend == 's3'"
        [main.s3.endpoint]
        ask.en = "S3 endpoint"
        type = "string"
        bind = "s3>endpoint:__INSTALL_DIR__/config.yml"

        [main.s3.bucket]
        ask.en = "S3 bucket"
        type = "string"
        bind = "s3>bucket:__INSTALL_DIR__/config.yml"

        [main.s3.access_key]
        ask.en = "S3 access key"
        type = "string"
        bind = "s3>accessKey:__INSTALL_DIR__/config.yml"

        [main.s3.secret_key]
        ask.en = "S3 secret key"
        type = "password"
        bind = "s3>secretKey:__INSTALL_DIR__/config.yml"

        [main.s3.region]
        ask.en = "S3 region"
        type = "string"
        bind = "s3>region:__INSTALL_DIR__/config.yml"

    [main.features]
        [main.features.enable_dashboard]
        ask.en = "Enable admin dashboard"
        type = "boolean"
        bind = "dashboard>enabled:__INSTALL_DIR__/config.yml"

        [main.features.dashboard_password]
        ask.en = "Dashboard password"
        help.en = "HTTP Basic Auth password for the /admin dashboard, used with your YunoHost admin username. This is Blossom's own credential, unrelated to your YunoHost account password - changing it here is the only way to change it. A random one is generated on install."
        type = "password"
        bind = "dashboard>password:__INSTALL_DIR__/config.yml"

        [main.features.enable_listing]
        ask.en = "Enable blob listing"
        type = "boolean"
        bind = "list>enabled:__INSTALL_DIR__/config.yml"

        [main.features.enable_media]
        ask.en = "Enable media optimization"
        type = "boolean"
        bind = "media>enabled:__INSTALL_DIR__/config.yml"

        [main.features.enable_mirror]
        ask.en = "Enable remote mirroring"
        type = "boolean"
        bind = "mirror>enabled:__INSTALL_DIR__/config.yml"

        [main.features.media_max_upload_size]
        ask.en = "Maximum media upload size"
        help.en = "Separate size limit for /media transcoding uploads (BUD-05). Independent of the main upload size limit above."
        type = "select"
        choices = ["100 MiB", "500 MiB", "1 GiB", "2 GiB", "5 GiB"]
        bind = "media>maxSize:__INSTALL_DIR__/config.yml"

    [main.auth]
        [main.auth.upload_require_auth]
        ask.en = "Require Nostr auth for uploads"
        help.en = "BUD-02: require a valid signed Nostr event to upload blobs. Disabling allows anonymous uploads."
        type = "boolean"
        bind = "upload>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.mirror_require_auth]
        ask.en = "Require Nostr auth for mirror requests"
        help.en = "BUD-04: require a valid signed Nostr event to mirror a remote blob onto this server."
        type = "boolean"
        bind = "mirror>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.delete_require_auth]
        ask.en = "Require Nostr auth for deletes"
        help.en = "BUD-02: require a valid signed Nostr event to delete blobs. Disabling allows anyone to delete any blob."
        type = "boolean"
        bind = "delete>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.media_require_auth]
        ask.en = "Require Nostr auth for media uploads"
        help.en = "BUD-05: require a valid signed Nostr event to upload media for transcoding."
        type = "boolean"
        bind = "media>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.list_require_auth]
        ask.en = "Require Nostr auth for listing blobs"
        help.en = "BUD-02: require a valid signed Nostr event to list a pubkey's blobs. Only relevant when blob listing is enabled above."
        type = "boolean"
        bind = "list>requireAuth:__INSTALL_DIR__/config.yml"

[media]
    name.en = "Media transcoding"

    [media.image]
        [media.image.media_image_output_format]
        ask.en = "Output format"
        help.en = "webp offers the best compression for web delivery."
        type = "select"
        choices = ["webp", "jpeg", "png"]
        bind = "image>outputFormat:__INSTALL_DIR__/config.yml"

        [media.image.media_image_quality]
        ask.en = "Quality"
        help.en = "Output quality 0-100. Higher = better quality, larger file."
        type = "number"
        min = 1
        max = 100
        bind = "image>quality:__INSTALL_DIR__/config.yml"

        [media.image.media_image_max_width]
        ask.en = "Max width (px)"
        type = "number"
        min = 1
        bind = "image>maxWidth:__INSTALL_DIR__/config.yml"

        [media.image.media_image_max_height]
        ask.en = "Max height (px)"
        type = "number"
        min = 1
        bind = "image>maxHeight:__INSTALL_DIR__/config.yml"

        [media.image.media_image_maintain_aspect_ratio]
        ask.en = "Maintain aspect ratio when resizing"
        help.en = "When off, images are stretched to exactly the max width x height instead of being scaled down to fit."
        type = "boolean"
        bind = "image>maintainAspectRatio:__INSTALL_DIR__/config.yml"

        [media.image.media_image_progressive]
        ask.en = "Progressive / interlaced encoding"
        help.en = "Progressive JPEG / interlaced PNG for better streaming on slow connections. No effect when output format is webp."
        type = "boolean"
        bind = "image>progressive:__INSTALL_DIR__/config.yml"

        [media.image.media_image_keep_exif]
        ask.en = "Keep EXIF metadata"
        help.en = "Off (recommended) strips EXIF data such as GPS location from uploaded images for privacy."
        type = "boolean"
        bind = "image>keepExif:__INSTALL_DIR__/config.yml"

        [media.image.media_image_fps]
        ask.en = "Max animated GIF frame rate"
        help.en = "Frames exceeding this rate are dropped."
        type = "number"
        min = 1
        bind = "image>fps:__INSTALL_DIR__/config.yml"

    [media.video]
        [media.video.video_profile]
        ask.en = "Output profile"
        help.en = "Sets container format, video codec, and audio codec together as a known-good combination. Blossom validates these three fields at startup and refuses to start on a mismatched combination, so they can't be set independently here."
        type = "select"
        choices.mp4_h264_aac = "MP4 - H.264 / AAC (recommended, most compatible)"
        choices.mp4_h265_aac = "MP4 - H.265 / AAC (smaller files, less compatible)"
        choices.webm_vp9_opus = "WebM - VP9 / Opus (best for web delivery)"
        choices.mkv_h264_aac = "MKV - H.264 / AAC"
        default = "mp4_h264_aac"
        # No bind: format/videoCodec/audioCodec are three separate keys in
        # config.yml that must change together, so this is applied manually
        # in scripts/config rather than bound to a single file path.

        [media.video.media_video_quality]
        ask.en = "Quality"
        help.en = "0-100, mapped to a CRF value. 100 = lossless, 0 = lowest quality."
        type = "number"
        min = 0
        max = 100
        bind = "video>quality:__INSTALL_DIR__/config.yml"

        [media.video.media_video_max_height]
        ask.en = "Max height (px)"
        help.en = "Width is scaled proportionally."
        type = "number"
        min = 1
        bind = "video>maxHeight:__INSTALL_DIR__/config.yml"

        [media.video.media_video_max_fps]
        ask.en = "Max frame rate"
        help.en = "Frames above this threshold are dropped."
        type = "number"
        min = 1
        bind = "video>maxFps:__INSTALL_DIR__/config.yml"
