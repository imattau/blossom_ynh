version = "1.0"

[main]
    [main.server]
        [main.server.public_domain]
        ask.en = "Public hostname"
        type = "string"
        bind = "publicDomain:__INSTALL_DIR__/config.yml"

        [main.server.storage_backend]
        ask.en = "Storage backend"
        type = "select"
        choices = ["local", "s3"]
        bind = "storage>backend:__INSTALL_DIR__/config.yml"

        [main.server.max_upload_size]
        ask.en = "Maximum upload size"
        type = "select"
        choices = ["100 MiB", "500 MiB", "1 GiB", "2 GiB", "5 GiB"]
        bind = "upload>maxSize:__INSTALL_DIR__/config.yml"

    [main.s3]
        visible = "storage_backend == 's3'"
        [main.s3.endpoint]
        ask.en = "S3 endpoint"
        type = "string"
        bind = "storage>s3>endpoint:__INSTALL_DIR__/config.yml"

        [main.s3.bucket]
        ask.en = "S3 bucket"
        type = "string"
        bind = "storage>s3>bucket:__INSTALL_DIR__/config.yml"

        [main.s3.access_key]
        ask.en = "S3 access key"
        type = "string"
        bind = "storage>s3>accessKey:__INSTALL_DIR__/config.yml"

        [main.s3.secret_key]
        ask.en = "S3 secret key"
        type = "password"
        bind = "storage>s3>secretKey:__INSTALL_DIR__/config.yml"

        [main.s3.region]
        ask.en = "S3 region"
        type = "string"
        bind = "storage>s3>region:__INSTALL_DIR__/config.yml"

    [main.features]
        [main.features.enable_dashboard]
        ask.en = "Enable admin dashboard"
        type = "boolean"
        bind = "dashboard>enabled:__INSTALL_DIR__/config.yml"

        [main.features.enable_listing]
        ask.en = "Enable blob listing"
        type = "boolean"
        bind = "list>enabled:__INSTALL_DIR__/config.yml"

        [main.features.enable_media]
        ask.en = "Enable media optimization"
        type = "boolean"
        bind = "media>enabled:__INSTALL_DIR__/config.yml"

        [main.features.enable_mirror]
        ask.en = "Enable remote mirroring"
        type = "boolean"
        bind = "mirror>enabled:__INSTALL_DIR__/config.yml"

        [main.features.media_max_upload_size]
        ask.en = "Maximum media upload size"
        help.en = "Separate size limit for /media transcoding uploads (BUD-05). Independent of the main upload size limit above."
        type = "select"
        choices = ["100 MiB", "500 MiB", "1 GiB", "2 GiB", "5 GiB"]
        bind = "media>maxSize:__INSTALL_DIR__/config.yml"

    [main.auth]
        [main.auth.upload_require_auth]
        ask.en = "Require Nostr auth for uploads"
        help.en = "BUD-02: require a valid signed Nostr event to upload blobs. Disabling allows anonymous uploads."
        type = "boolean"
        bind = "upload>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.mirror_require_auth]
        ask.en = "Require Nostr auth for mirror requests"
        help.en = "BUD-04: require a valid signed Nostr event to mirror a remote blob onto this server."
        type = "boolean"
        bind = "mirror>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.delete_require_auth]
        ask.en = "Require Nostr auth for deletes"
        help.en = "BUD-02: require a valid signed Nostr event to delete blobs. Disabling allows anyone to delete any blob."
        type = "boolean"
        bind = "delete>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.media_require_auth]
        ask.en = "Require Nostr auth for media uploads"
        help.en = "BUD-05: require a valid signed Nostr event to upload media for transcoding."
        type = "boolean"
        bind = "media>requireAuth:__INSTALL_DIR__/config.yml"

        [main.auth.list_require_auth]
        ask.en = "Require Nostr auth for listing blobs"
        help.en = "BUD-02: require a valid signed Nostr event to list a pubkey's blobs. Only relevant when blob listing is enabled above."
        type = "boolean"
        bind = "list>requireAuth:__INSTALL_DIR__/config.yml"
